<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data: https://azure.assets.harvey.ai; connect-src 'none'; webrtc 'block'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Holiday &amp; Remote Work Calendar — 2026</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      padding: 1rem;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      margin-bottom: 0.25rem;
      font-size: 1.5rem;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
    }

    /* Member selector */
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .member-btn {
      padding: 0.5rem 1.2rem;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.15s;
    }

    .member-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .member-btn.active {
      border-width: 3px;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .member-btn[data-member="Matt"] {
      color: #2563eb;
    }

    .member-btn[data-member="Matt"].active {
      background: #dbeafe;
      border-color: #2563eb;
    }

    .member-btn[data-member="Cecilia"] {
      color: #9333ea;
    }

    .member-btn[data-member="Cecilia"].active {
      background: #f3e8ff;
      border-color: #9333ea;
    }

    .member-btn[data-member="Guillermo"] {
      color: #059669;
    }

    .member-btn[data-member="Guillermo"].active {
      background: #d1fae5;
      border-color: #059669;
    }

    .member-btn[data-member="Laura"] {
      color: #dc2626;
    }

    .member-btn[data-member="Laura"].active {
      background: #fee2e2;
      border-color: #dc2626;
    }

    .member-btn[data-member="PwC day"] {
      color: #ea580c;
    }

    .member-btn[data-member="PwC day"].active {
      background: #fff7ed;
      border-color: #ea580c;
    }

    /* Legend */
    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding: 0.75rem 1rem;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    .legend-group {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8rem;
    }

    .legend-chip {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      display: inline-block;
      flex-shrink: 0;
    }

    .legend-chip.striped {
      background-size: 6px 6px;
    }

    /* Calendar grid */
    .months-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.25rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .month-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      padding: 1rem;
    }

    .month-title {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #334155;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 0.25rem;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .day-cell {
      min-height: 52px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 2px;
      cursor: pointer;
      position: relative;
      transition: background 0.1s;
      display: flex;
      flex-direction: column;
    }

    .day-cell:hover {
      background: #f8fafc;
    }

    .day-cell.empty {
      border: none;
      cursor: default;
    }

    .day-cell.empty:hover {
      background: transparent;
    }

    .day-cell.weekend {
      background: #f0f0f0;
    }

    .day-cell.weekend:hover {
      background: #e8e8e8;
    }

    .day-cell.holiday {
      background: #ffe0e0;
    }

    .day-cell.holiday:hover {
      background: #ffd0d0;
    }

    .day-cell.holiday.weekend {
      background: #f5d5d5;
    }

    .day-num {
      font-size: 0.7rem;
      font-weight: 600;
      color: #475569;
      line-height: 1;
      margin-bottom: 1px;
      padding-left: 2px;
    }

    .day-cell.weekend .day-num {
      color: #94a3b8;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 1px;
      flex: 1;
      align-items: flex-start;
      align-content: flex-start;
    }

    .chip {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .chip.striped {
      background-size: 5px 5px;
    }

    /* Colors */
    .color-matt-holiday {
      background: #2563eb;
    }

    .color-matt-remote {
      background: repeating-linear-gradient(
        45deg,
        #2563eb,
        #2563eb 2px,
        #93c5fd 2px,
        #93c5fd 4px
      );
      background-size: 5px 5px;
    }

    .color-cecilia-holiday {
      background: #9333ea;
    }

    .color-cecilia-remote {
      background: repeating-linear-gradient(
        45deg,
        #9333ea,
        #9333ea 2px,
        #d8b4fe 2px,
        #d8b4fe 4px
      );
      background-size: 5px 5px;
    }

    .color-guillermo-holiday {
      background: #059669;
    }

    .color-guillermo-remote {
      background: repeating-linear-gradient(
        45deg,
        #059669,
        #059669 2px,
        #6ee7b7 2px,
        #6ee7b7 4px
      );
      background-size: 5px 5px;
    }

    .color-laura-holiday {
      background: #dc2626;
    }

    .color-laura-remote {
      background: repeating-linear-gradient(
        45deg,
        #dc2626,
        #dc2626 2px,
        #fca5a5 2px,
        #fca5a5 4px
      );
      background-size: 5px 5px;
    }

    .color-pwc-day-holiday {
      background: #ea580c;
    }

    /* Tooltip */
    .day-cell .tooltip {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #fff;
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      z-index: 100;
      pointer-events: none;
    }

    .day-cell:hover .tooltip {
      display: block;
    }

    /* Instructions */
    .instructions {
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 1rem;
      font-style: italic;
    }

    /* Error banner */
    .error-banner {
      display: none;
      text-align: center;
      padding: 0.5rem 1rem;
      margin-bottom: 1rem;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    /* Responsive */
    @media (max-width: 700px) {
      .months-grid {
        grid-template-columns: 1fr;
      }

      .day-cell {
        min-height: 44px;
      }

      .chip {
        width: 12px;
        height: 12px;
      }

      h1 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <h1>Team Calendar &mdash; 2026</h1>
  <p class="subtitle">Holiday &amp; Remote Work Planner</p>

  <div class="controls" id="controls"></div>

  <p class="instructions">
    Select your name above, then click dates to cycle:
    unmarked &rarr; Holiday &rarr; Remote Work &rarr; unmarked.
    PwC day toggles on/off only.
  </p>

  <div class="error-banner" id="errorBanner"></div>
  <div class="legend" id="legend"></div>
  <div class="months-grid" id="calendar"></div>

  <script>
    (async function () {
      const SUPABASE_URL = 'https://lzjhldscbvxnzalgojrm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6amhsZHNjYnZ4bnphbGdvanJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MDU2MzUsImV4cCI6MjA5NzI4MTYzNX0.0-tPAHXoFwMcQPtZKvrZdFYbj7xGQVgBgeqtqEddfNg';

      let sb = null;
      try {
        if (window.supabase && window.supabase.createClient) {
          sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
      } catch (e) { /* CDN not loaded */ }

      const TABLE = 'Vacaciones';

      const MEMBERS = ["Matt", "Cecilia", "Guillermo", "Laura", "PwC day"];
      const STATES = ["none", "holiday", "remote"];

      // CSS-safe slug mapping for member names
      const MEMBER_SLUG = {
        "Matt": "matt",
        "Cecilia": "cecilia",
        "Guillermo": "guillermo",
        "Laura": "laura",
        "PwC day": "pwc-day"
      };

      const MONTHS = [
        { name: "June", year: 2026, month: 5, days: 30 },
        { name: "July", year: 2026, month: 6, days: 31 },
        { name: "August", year: 2026, month: 7, days: 31 },
        { name: "September", year: 2026, month: 8, days: 30 },
        { name: "October", year: 2026, month: 9, days: 31 },
        { name: "November", year: 2026, month: 10, days: 30 },
        { name: "December", year: 2026, month: 11, days: 31 }
      ];

      const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

      // Spanish public holidays (Jun-Dec 2026)
      const HOLIDAYS = new Set([
        "2026-08-15",
        "2026-10-12",
        "2026-11-01",
        "2026-12-06",
        "2026-12-08",
        "2026-12-25"
      ]);

      let activeMember = MEMBERS[0];
      let data = {};

      // ---- Supabase helpers ----
      function showError(msg) {
        const el = document.getElementById("errorBanner");
        el.textContent = msg;
        el.style.display = "block";
        setTimeout(() => { el.style.display = "none"; }, 5000);
      }

      async function fetchAll() {
        if (!sb) { showError("Supabase not configured. Replace credentials in the source."); return; }
        try {
          const { data: rows, error } = await sb.from(TABLE).select("*");
          if (error) throw error;
          data = {};
          (rows || []).forEach((row) => {
            const dk = row.fecha;
            if (!data[dk]) data[dk] = {};
            if (row.vacaciones) {
              data[dk][row.persona] = "holiday";
            } else if (row.remoto) {
              data[dk][row.persona] = "remote";
            }
          });
          renderAllChips();
        } catch (err) {
          showError("Error loading: " + (err.message || err));
        }
      }

      async function syncToSupabase(dateKey, member, state) {
        if (!sb) { showError("Supabase not configured."); return; }
        try {
          if (state === "none") {
            const { error } = await sb.from(TABLE).delete().eq("persona", member).eq("fecha", dateKey);
            if (error) throw error;
          } else {
            const payload = {
              persona: member,
              fecha: dateKey,
              vacaciones: state === "holiday",
              remoto: state === "remote"
            };
            const { error } = await sb.from(TABLE).upsert(payload, { onConflict: "persona,fecha" });
            if (error) throw error;
          }
        } catch (err) {
          showError("Error saving: " + (err.message || err));
        }
      }

      // ---- data helpers (same structure as original) ----
      function getKey(year, month, day) {
        return (
          year +
          "-" +
          String(month + 1).padStart(2, "0") +
          "-" +
          String(day).padStart(2, "0")
        );
      }

      function getState(dateKey, member) {
        if (!data[dateKey]) return "none";
        return data[dateKey][member] || "none";
      }

      function setState(dateKey, member, state) {
        if (!data[dateKey]) data[dateKey] = {};

        if (state === "none") {
          delete data[dateKey][member];
          if (Object.keys(data[dateKey]).length === 0) {
            delete data[dateKey];
          }
        } else {
          data[dateKey][member] = state;
        }

        syncToSupabase(dateKey, member, state);
      }

      function cycleState(dateKey, member) {
        const current = getState(dateKey, member);
        if (member === "PwC day") {
          // Only 2 states: none <-> holiday
          setState(dateKey, member, current === "none" ? "holiday" : "none");
        } else {
          const idx = STATES.indexOf(current);
          const next = STATES[(idx + 1) % STATES.length];
          setState(dateKey, member, next);
        }
      }

      function renderControls() {
        const container = document.getElementById("controls");
        container.innerHTML = "";

        MEMBERS.forEach((m) => {
          const btn = document.createElement("button");
          btn.className = "member-btn" + (m === activeMember ? " active" : "");
          btn.dataset.member = m;
          btn.textContent = m;

          btn.onclick = () => {
            activeMember = m;
            renderControls();
          };

          container.appendChild(btn);
        });
      }

      function renderLegend() {
        const container = document.getElementById("legend");
        let html = "";

        MEMBERS.forEach((m) => {
          const slug = MEMBER_SLUG[m];

          html +=
            '<div class="legend-group">' +
            '<span class="legend-chip color-' +
            slug +
            '-holiday"></span>' +
            m +
            (m === "PwC day" ? "" : " Holiday") +
            "</div>";

          if (m !== "PwC day") {
            html +=
              '<div class="legend-group">' +
              '<span class="legend-chip striped color-' +
              slug +
              '-remote"></span>' +
              m +
              " Remote</div>";
          }
        });

        // Weekend & Holiday legend
        html += '<div class="legend-group"><span class="legend-chip" style="background:#f0f0f0;border:1px solid #ccc"></span>Weekend</div>';
        html += '<div class="legend-group"><span class="legend-chip" style="background:#ffe0e0;border:1px solid #f5c6c6"></span>Public Holiday</div>';

        container.innerHTML = html;
      }

      function renderCalendar() {
        const container = document.getElementById("calendar");
        container.innerHTML = "";

        MONTHS.forEach((mo) => {
          const card = document.createElement("div");
          card.className = "month-card";

          let html = '<div class="month-title">' + mo.name + " " + mo.year + "</div>";
          html += '<div class="weekdays">';

          WEEKDAYS.forEach((d) => {
            html += "<div>" + d + "</div>";
          });

          html += '</div><div class="days-grid">';

          // JS getDay(): 0=Sun,1=Mon,...6=Sat
          // Convert to Monday-based start: 0=Mon ... 6=Sun
          const firstDay = new Date(mo.year, mo.month, 1).getDay();
          const startOffset = firstDay === 0 ? 6 : firstDay - 1;

          for (let i = 0; i < startOffset; i++) {
            html += '<div class="day-cell empty"></div>';
          }

          for (let d = 1; d <= mo.days; d++) {
            const dateKey = getKey(mo.year, mo.month, d);
            const dow = (startOffset + d - 1) % 7;
            const isWeekend = dow >= 5;
            const isHoliday = HOLIDAYS.has(dateKey);

            let cls = "day-cell";
            if (isWeekend) cls += " weekend";
            if (isHoliday) cls += " holiday";

            html +=
              '<div class="' + cls +
              '" data-date="' +
              dateKey +
              '">';

            html += '<span class="day-num">' + d + "</span>";
            html += '<div class="chips" id="chips-' + dateKey + '"></div>';
            html += "</div>";
          }

          html += "</div>";
          card.innerHTML = html;
          container.appendChild(card);
        });

        document.querySelectorAll(".day-cell:not(.empty)").forEach((cell) => {
          cell.addEventListener("click", function () {
            const dateKey = this.dataset.date;
            cycleState(dateKey, activeMember);
            renderChips(dateKey);
          });
        });

        renderAllChips();
      }

      function renderAllChips() {
        // Render chips for all dates that have data
        Object.keys(data).forEach((dateKey) => {
          renderChips(dateKey);
        });
      }

      function renderChips(dateKey) {
        const container = document.getElementById("chips-" + dateKey);
        if (!container) return;

        let html = "";
        const tooltipParts = [];

        MEMBERS.forEach((m) => {
          const state = getState(dateKey, m);

          if (state !== "none") {
            const slug = MEMBER_SLUG[m];
            const cls =
              "chip color-" +
              slug +
              "-" +
              state +
              (state === "remote" ? " striped" : "");

            html +=
              '<div class="' +
              cls +
              '" title="' +
              m +
              ": " +
              state +
              '"></div>';

            if (m === "PwC day") {
              tooltipParts.push("PwC day");
            } else {
              tooltipParts.push(
                m + ": " + (state === "holiday" ? "Holiday" : "Remote")
              );
            }
          }
        });

        container.innerHTML = html;

        const cell = container.parentElement;
        let tooltip = cell.querySelector(".tooltip");

        if (tooltipParts.length > 0) {
          if (!tooltip) {
            tooltip = document.createElement("div");
            tooltip.className = "tooltip";
            cell.appendChild(tooltip);
          }
          tooltip.textContent = tooltipParts.join(" | ");
        } else if (tooltip) {
          tooltip.remove();
        }
      }

      renderControls();
      renderLegend();
      renderCalendar();
      await fetchAll();
    })();
  </script>
</body>
</html>
