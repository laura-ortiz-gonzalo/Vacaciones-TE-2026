<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Holiday &amp; Remote Work Calendar — Summer 2026</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f0f4f8;
  color: #1a202c;
  padding: 1rem;
  min-height: 100vh;
}
h1 { text-align: center; margin-bottom: 0.25rem; font-size: 1.5rem; }
.subtitle { text-align: center; color: #64748b; margin-bottom: 1.25rem; font-size: 0.9rem; }

/* Member selector */
.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-bottom: 1.25rem; }
.member-btn {
  padding: 0.5rem 1.2rem;
  border: 2px solid #cbd5e1;
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 500;
  transition: all 0.15s;
}
.member-btn:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
.member-btn.active { border-width: 3px; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
.member-btn[data-member="Matt"] { color: #2563eb; }
.member-btn[data-member="Matt"].active { background: #dbeafe; border-color: #2563eb; }
.member-btn[data-member="Cecilia"] { color: #9333ea; }
.member-btn[data-member="Cecilia"].active { background: #f3e8ff; border-color: #9333ea; }
.member-btn[data-member="Guillermo"] { color: #059669; }
.member-btn[data-member="Guillermo"].active { background: #d1fae5; border-color: #059669; }
.member-btn[data-member="Laura"] { color: #dc2626; }
.member-btn[data-member="Laura"].active { background: #fee2e2; border-color: #dc2626; }

/* Legend */
.legend {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem;
  margin-bottom: 1.5rem; padding: 0.75rem 1rem;
  background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.legend-group { display: flex; align-items: center; gap: 0.35rem; font-size: 0.8rem; }
.legend-chip {
  width: 18px; height: 18px; border-radius: 4px; display: inline-block; flex-shrink: 0;
}
.legend-chip.striped {
  background-size: 6px 6px;
}

/* Calendar grid */
.months-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 1.25rem;
  max-width: 1400px;
  margin: 0 auto;
}
.month-card {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  padding: 1rem;
}
.month-title {
  text-align: center;
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
  color: #334155;
}
.weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  font-size: 0.75rem;
  font-weight: 600;
  color: #64748b;
  margin-bottom: 0.25rem;
}
.days-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.day-cell {
  min-height: 52px;
  border: 1px solid #e2e8f0;
  border-radius: 6px;
  padding: 2px;
  cursor: pointer;
  position: relative;
  transition: background 0.1s;
  display: flex;
  flex-direction: column;
}
.day-cell:hover { background: #f8fafc; }
.day-cell.empty { border: none; cursor: default; }
.day-cell.empty:hover { background: transparent; }
.day-num {
  font-size: 0.7rem;
  font-weight: 600;
  color: #475569;
  line-height: 1;
  margin-bottom: 1px;
  padding-left: 2px;
}
.day-cell.weekend .day-num { color: #94a3b8; }
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 1px;
  flex: 1;
  align-items: flex-start;
  align-content: flex-start;
}
.chip {
  width: 14px; height: 14px;
  border-radius: 3px;
  flex-shrink: 0;
}
.chip.striped { background-size: 5px 5px; }

/* Colors */
.color-matt-holiday { background: #2563eb; }
.color-matt-remote { background: repeating-linear-gradient(45deg, #2563eb, #2563eb 2px, #93c5fd 2px, #93c5fd 4px); background-size: 5px 5px; }
.color-cecilia-holiday { background: #9333ea; }
.color-cecilia-remote { background: repeating-linear-gradient(45deg, #9333ea, #9333ea 2px, #d8b4fe 2px, #d8b4fe 4px); background-size: 5px 5px; }
.color-guillermo-holiday { background: #059669; }
.color-guillermo-remote { background: repeating-linear-gradient(45deg, #059669, #059669 2px, #6ee7b7 2px, #6ee7b7 4px); background-size: 5px 5px; }
.color-laura-holiday { background: #dc2626; }
.color-laura-remote { background: repeating-linear-gradient(45deg, #dc2626, #dc2626 2px, #fca5a5 2px, #fca5a5 4px); background-size: 5px 5px; }

/* Tooltip */
.day-cell .tooltip {
  display: none;
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  font-size: 0.7rem;
  padding: 4px 8px;
  border-radius: 4px;
  white-space: nowrap;
  z-index: 100;
  pointer-events: none;
}
.day-cell:hover .tooltip { display: block; }

/* Instructions */
.instructions {
  text-align: center;
  font-size: 0.8rem;
  color: #64748b;
  margin-bottom: 1rem;
  font-style: italic;
}

/* Responsive */
@media (max-width: 700px) {
  .months-grid { grid-template-columns: 1fr; }
  .day-cell { min-height: 44px; }
  .chip { width: 12px; height: 12px; }
  h1 { font-size: 1.2rem; }
}
</style>
</head>
<body>

<h1>Team Calendar — Summer 2026</h1>
<p class="subtitle">Holiday &amp; Remote Work Planner</p>

<div class="controls" id="controls"></div>

<p class="instructions">Select your name above, then click dates to cycle: unmarked &rarr; Holiday &rarr; Remote Work &rarr; unmarked</p>

<div class="legend" id="legend"></div>

<div class="months-grid" id="calendar"></div>

<script>
(function() {
  const MEMBERS = ['Matt', 'Cecilia', 'Guillermo', 'Laura'];
  const COLORS = {
    Matt: '#2563eb',
    Cecilia: '#9333ea',
    Guillermo: '#059669',
    Laura: '#dc2626'
  };
  const STATES = ['none', 'holiday', 'remote'];
  const STORAGE_KEY = 'teamCalendar2026';
  const MONTHS = [
    { name: 'June', year: 2026, month: 5, days: 30 },
    { name: 'July', year: 2026, month: 6, days: 31 },
    { name: 'August', year: 2026, month: 7, days: 31 },
    { name: 'September', year: 2026, month: 8, days: 30 }
  ];
  const WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  let activeMember = MEMBERS[0];
  let data = loadData();

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return {};
  }

  function saveData() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
  }

  function getKey(year, month, day) {
    return year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
  }

  function getState(dateKey, member) {
    if (!data[dateKey]) return 'none';
    return data[dateKey][member] || 'none';
  }

  function setState(dateKey, member, state) {
    if (!data[dateKey]) data[dateKey] = {};
    if (state === 'none') {
      delete data[dateKey][member];
      if (Object.keys(data[dateKey]).length === 0) delete data[dateKey];
    } else {
      data[dateKey][member] = state;
    }
    saveData();
  }

  function cycleState(dateKey, member) {
    const current = getState(dateKey, member);
    const idx = STATES.indexOf(current);
    const next = STATES[(idx + 1) % STATES.length];
    setState(dateKey, member, next);
  }

  // Build controls
  function renderControls() {
    const container = document.getElementById('controls');
    container.innerHTML = '';
    MEMBERS.forEach(m => {
      const btn = document.createElement('button');
      btn.className = 'member-btn' + (m === activeMember ? ' active' : '');
      btn.dataset.member = m;
      btn.textContent = m;
      btn.onclick = () => { activeMember = m; renderControls(); };
      container.appendChild(btn);
    });
  }

  // Build legend
  function renderLegend() {
    const container = document.getElementById('legend');
    let html = '';
    MEMBERS.forEach(m => {
      const mLower = m.toLowerCase();
      html += '<div class="legend-group"><span class="legend-chip color-' + mLower + '-holiday"></span>' + m + ' Holiday</div>';
      html += '<div class="legend-group"><span class="legend-chip striped color-' + mLower + '-remote"></span>' + m + ' Remote</div>';
    });
    container.innerHTML = html;
  }

  // Build calendar
  function renderCalendar() {
    const container = document.getElementById('calendar');
    container.innerHTML = '';

    MONTHS.forEach(mo => {
      const card = document.createElement('div');
      card.className = 'month-card';

      let html = '<div class="month-title">' + mo.name + ' ' + mo.year + '</div>';
      html += '<div class="weekdays">';
      WEEKDAYS.forEach(d => { html += '<div>' + d + '</div>'; });
      html += '</div><div class="days-grid">';

      // First day of month (0=Sun,1=Mon,...6=Sat) -> convert to Mon-start (0=Mon...6=Sun)
      const firstDay = new Date(mo.year, mo.month, 1).getDay();
      const startOffset = (firstDay === 0) ? 6 : firstDay - 1;

      for (let i = 0; i < startOffset; i++) {
        html += '<div class="day-cell empty"></div>';
      }

      for (let d = 1; d <= mo.days; d++) {
        const dateKey = getKey(mo.year, mo.month, d);
        const dow = (startOffset + d - 1) % 7; // 0=Mon...6=Sun
        const isWeekend = dow >= 5;
        html += '<div class="day-cell' + (isWeekend ? ' weekend' : '') + '" data-date="' + dateKey + '">';
        html += '<span class="day-num">' + d + '</span>';
        html += '<div class="chips" id="chips-' + dateKey + '"></div>';
        html += '</div>';
      }

      html += '</div>';
      card.innerHTML = html;
      container.appendChild(card);
    });

    // Attach click handlers
    document.querySelectorAll('.day-cell:not(.empty)').forEach(cell => {
      cell.addEventListener('click', function() {
        const dateKey = this.dataset.date;
        cycleState(dateKey, activeMember);
        renderChips(dateKey);
      });
    });

    // Render all chips
    renderAllChips();
  }

  function renderAllChips() {
    Object.keys(data).forEach(dateKey => {
      renderChips(dateKey);
    });
  }

  function renderChips(dateKey) {
    const container = document.getElementById('chips-' + dateKey);
    if (!container) return;
    let html = '';
    let tooltipParts = [];
    MEMBERS.forEach(m => {
      const state = getState(dateKey, m);
      if (state !== 'none') {
        const mLower = m.toLowerCase();
        const cls = 'chip color-' + mLower + '-' + state + (state === 'remote' ? ' striped' : '');
        html += '<div class="' + cls + '" title="' + m + ': ' + state + '"></div>';
        tooltipParts.push(m + ': ' + (state === 'holiday' ? 'Holiday' : 'Remote'));
      }
    });
    container.innerHTML = html;
    // Update tooltip
    const cell = container.parentElement;
    let tooltip = cell.querySelector('.tooltip');
    if (tooltipParts.length > 0) {
      if (!tooltip) {
        tooltip = document.createElement('div');
        tooltip.className = 'tooltip';
        cell.appendChild(tooltip);
      }
      tooltip.textContent = tooltipParts.join(' | ');
    } else if (tooltip) {
      tooltip.remove();
    }
  }

  // Init
  renderControls();
  renderLegend();
  renderCalendar();
})();
</script>
</body>
</html>
